# Base compose — safe default (prod target).
# Usage:
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   Test:        docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  web:
    build:
      context: .
      target: prod
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - db-data:/app/instance
      - ./watched_clubs.json:/app/watched_clubs.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:5000/health'); import json; d=json.loads(r.read()); exit(0 if d.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db-data:
