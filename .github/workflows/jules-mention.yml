name: Jules Mention

on:
  issue_comment:
    types: [created]

jobs:
  trigger-review:
    if: |
      contains(github.event.comment.body, '@jules') &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger review via workflow_dispatch
        run: |
          gh workflow run pr-review.yml \
            --ref develop \
            -f pr_number="${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
